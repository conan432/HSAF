# Reproduction configurations for History-State-Aware Framework for Unified CTR Models.
# The four datasets use max_len=100, one training epoch, and the same protocol as UniRank.
# Paths in dataset_config.yaml are relative to the repository root.

Base:
  model_root: './checkpoints/'
  num_workers: 4
  verbose: 1
  early_stop_patience: 2
  pickle_feature_encoder: True
  save_best_only: True
  eval_steps: null
  debug_mode: False
  group_id: user_id
  use_features: null
  feature_specs: null
  feature_config: null
  dense_optimizer: AdamW
  sparse_optimizer: Adagrad
  dense_learning_rate: 1.0e-4
  sparse_learning_rate: 0.05
  dense_weight_decay: 0
  enable_torch_compile: True
  gradient_checkpointing: False

RankMixer_Taobao_Action:
  model: RankMixer
  dataset_id: Taobao_Action
  loss:
  - binary_crossentropy
  - binary_crossentropy
  - binary_crossentropy
  - binary_crossentropy
  num_tasks: 4
  metrics:
  - logloss
  - AUC
  task: binary_classification
  batch_size: 2048
  embedding_dim: 16
  num_layers: 3
  expansion_factor: 4
  token_dim: 256
  num_ns_token: 5
  num_real_token: 0
  num_heads: 2
  num_mix_heads: 2
  low_rank_dim: 16
  real_seq_len: 20
  tower_hidden_units:
  - 128
  - 64
  tower_activations: ReLU
  attention_dropout: 0
  net_dropout: 0
  epochs: 1
  shuffle: true
  seed: 20262027
  monitor:
    AUC: 1
    logloss: 0
  monitor_mode: max
  max_len: 100
  accumulation_steps: 1
  model_root: ./checkpoints/
  keep_checkpoint: true
  num_workers: 4
